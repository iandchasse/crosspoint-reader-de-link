[platformio]
default_envs = s3_default
build_cache_dir = .cache
extra_configs = platformio.local.ini

[crosspoint]
version = 1.4.1

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
; board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# FreeInk needs an explicit device or BoardConfig.h #errors. These C3 envs are
# vestigial here (no board is set above), but keep them coherent.
  -DFREEINK_DEVICE_X4=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# Increase PNG scanline buffer to support up to 2048px wide images
# Default is (320*4+1)*2=2562, we need more for larger images
  -DPNG_MAX_BUFFERED_PIXELS=16416
# wolfSSL TLS 1.3 (the system mbedTLS ships TLS 1.3 as empty stubs; kosync/OPDS/OTA
# need real 1.3 and it OOMs on the mbedTLS path). WOLFSSL_SP_RISCV32 is the single-
# precision math accel for the C3's RISC-V core — the S3 env drops it (see base_s3).
  -DFREEINK_NET_WOLFSSL=1
  -DWOLFSSL_USER_SETTINGS
  -DWOLFSSL_OPTIONS_H
  -DWOLFSSL_CLIENT_EXAMPLE
  -DWOLFSSL_TLS13
  -DWOLFSSL_SP_RISCV32
  -DHAVE_TLS_EXTENSIONS
  -DHAVE_SUPPORTED_CURVES
  -DHAVE_HKDF
  -DHAVE_FFDHE_2048
  -DHAVE_CURVE25519
  -DWC_RSA_PSS
  -DHAVE_SNI
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort
  -fno-exceptions

build_unflags =
  -std=gnu++11
  -fexceptions

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

extra_scripts =
  pre:scripts/patch_wolfssl.py
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py
  post:scripts/register_unit_tests_target.py

; Libraries
lib_deps =
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  UsbMsc=symlink://freeink-sdk/libs/hardware/UsbMsc
  SecureNet=symlink://freeink-sdk/libs/network/SecureNet
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ ^1.0.0
  links2004/WebSockets @ 2.7.3
  wolfssl/Arduino-wolfSSL @ 5.7.2

lib_ignore =
  BLE

[base_s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
  -DMINIZ_NO_STDIO=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# Increase PNG scanline buffer to support up to 2048px wide images
# Default is (320*4+1)*2=2562, we need more for larger images
  -DPNG_MAX_BUFFERED_PIXELS=16416
# Enable PSRAM (2MB on this board)
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DFRONTLIGHT_PRESENT
# FreeInk device selection. Drives the board profile, the SSD1677 driver, the
# frontlight capability, and the native SDMMC transport.
  -DFREEINK_DEVICE_DELINK=1
# SdFat must expose the generic FsBlockDeviceInterface so the SDK's native
# esp-idf SDMMC block device can back an FsVolume (SdFat has no SDIO driver).
  -DUSE_BLOCK_DEVICE_INTERFACE=1
# wolfSSL TLS 1.3 for kosync/OPDS/OTA (system mbedTLS stubs out 1.3 and OOMs).
# Deliberately WITHOUT -DWOLFSSL_SP_RISCV32 — that single-precision math path is
# for the C3's RISC-V core; the S3 is Xtensa and must use wolfSSL's portable SP.
  -DFREEINK_NET_WOLFSSL=1
  -DWOLFSSL_USER_SETTINGS
  -DWOLFSSL_OPTIONS_H
  -DWOLFSSL_CLIENT_EXAMPLE
  -DWOLFSSL_TLS13
  -DHAVE_TLS_EXTENSIONS
  -DHAVE_SUPPORTED_CURVES
  -DHAVE_HKDF
  -DHAVE_FFDHE_2048
  -DHAVE_CURVE25519
  -DWC_RSA_PSS
  -DHAVE_SNI

build_unflags =
  -std=gnu++11

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
; PSRAM: 2MB QSPI PSRAM on ESP32-S3. Use qio_qspi so the build selects the correct mode.
board_build.arduino.memory_type = qio_qspi

extra_scripts =
  pre:scripts/patch_wolfssl.py
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py

; Libraries
lib_deps =
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  UsbMsc=symlink://freeink-sdk/libs/hardware/UsbMsc
  SecureNet=symlink://freeink-sdk/libs/network/SecureNet
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ 1.1.6
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3
  wolfssl/Arduino-wolfSSL @ 5.7.2

lib_ignore =
  BLE

[env:default]
extends = base
build_flags =
  ${base.build_flags}
  ; CROSSPOINT_VERSION is set by scripts/git_branch.py (includes branch + short SHA)
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; Set log level to debug for development builds


[env:gh_release]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds

[env:gh_release_rc]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds

[env:slim]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-slim\"
  ; serial output is disabled in slim builds to save space
  -UENABLE_SERIAL_LOG


[env:s3_default]
extends = base_s3
build_flags =
  ${base_s3.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-s3-dev\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; Set log level to debug for development builds
; Auto-enter bootloader and hard-reset after flash (fixes USB re-enumeration on ESP32-S3 native USB)
upload_flags =
  --before=default_reset
  --after=hard_reset

[env:s3_gh_release]
extends = base_s3
build_flags =
  ${base_s3.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-s3\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=0 ; Set log level to error for release builds  

[env:s3_gh_release_rc]
extends = base_s3
build_flags =
  ${base_s3.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-s3-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds  

[env:s3_slim]
extends = base_s3
build_flags =
  ${base_s3.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-s3-slim\"
  ; serial output is disabled in slim builds to save space
  -UENABLE_SERIAL_LOG
  
